name: Build Android TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # KHONG DUNG android-actions/setup-android@v3 nua.
    # ubuntu-latest da co san Android SDK, cmdline-tools, platform-tools,
    # platforms;android-34 va build-tools. Cai step cu dung
    # packages: tools platform-tools nen luon fail vi package 'tools'
    # da bi Google xoa tu lau.

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      # Dung lenh 'gradle' thay vi './gradlew' vi repo dang thieu
      # gradlew / gradle-wrapper.jar. setup-gradle o tren da cai san Gradle 8.5.
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiTvLauncher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
