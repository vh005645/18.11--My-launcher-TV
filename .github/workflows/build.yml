name: Build Android TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Check files (debug)
      run: |
        ls -la
        ls -la app/ || true
        echo "--- gradlew exists? ---"
        ls -la gradlew* || echo "NO gradlew - will use system gradle instead"

    - name: Build Debug APK
      # QUAN TRONG: Project cua ban KHONG CO file gradlew nen KHONG dung ./gradlew
      # Dung lenh 'gradle' truc tiep (da cai o step Setup Gradle 8.5)
      run: gradle assembleDebug --stacktrace --info

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: RedmiTvLauncher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
